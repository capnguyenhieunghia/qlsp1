<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Quản lý sửa chữa</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f3f5fa;--p:#fff;--t:#182238;--m:#7c879c;--l:#e3e8f0;--b:#315efb;--s:#edf1ff;--r:#c43e50;--g:#16865e;--o:#b77819;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101728;--p:#182238;--t:#edf2ff;--m:#9ba8c1;--l:#2a3853;--s:#25365e;--g:#4fd1a1;--o:#e8b04f;--r:#ff7b8c;color-scheme:dark}}
:root[data-theme=dark]{--bg:#101728;--p:#182238;--t:#edf2ff;--m:#9ba8c1;--l:#2a3853;--s:#25365e;--g:#4fd1a1;--o:#e8b04f;--r:#ff7b8c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--p);border-bottom:1px solid var(--l);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:5}header h1{font-size:16px;margin:0;flex:1}
nav{display:flex;overflow-x:auto;background:var(--p);border-bottom:1px solid var(--l)}nav button{flex:none;border:0;background:0;color:var(--m);padding:11px 14px;font:600 13px inherit;border-bottom:3px solid transparent}nav button.on{color:var(--b);border-color:var(--b)}
main{padding:12px;max-width:1000px;margin:auto}.c{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:13px;margin-bottom:10px}.c h2,.c h3{margin:0 0 8px;font-size:15px}
input,select,textarea{width:100%;border:1px solid var(--l);background:var(--bg);color:var(--t);border-radius:8px;padding:9px;font:inherit;min-width:0}label{font-size:11px;color:var(--m);font-weight:600;display:block;margin:6px 0 2px}
.btn{border:0;background:var(--b);color:#fff;border-radius:8px;padding:9px 12px;font:600 13px inherit;cursor:pointer}.btn.a{background:var(--s);color:var(--b)}.btn.x{background:transparent;border:1px solid var(--l);color:var(--t)}.btn.d{background:transparent;border:1px solid var(--r);color:var(--r)}
@page{margin:6mm}.lbs{display:flex;flex-wrap:wrap;gap:3mm;background:#fff;padding:6px;border-radius:8px}.lb{display:flex;gap:4px;align-items:center;border:1px dashed #888;padding:2mm;color:#000;background:#fff;font:10px/1.25 Arial;overflow:hidden;break-inside:avoid}.lb b{font-size:13px}a.btn{text-decoration:none}.bar{display:flex;align-items:end;gap:6px;height:110px}.bar div{flex:1;background:var(--b);border-radius:4px 4px 0 0;min-height:2px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>.btn{flex:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mut{color:var(--m);font-size:12px}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--s);color:var(--b)}.pill.w{background:#fff3df;color:var(--o)}.pill.r{background:#ffe9ec;color:var(--r)}.pill.k{background:#e3f7ee;color:var(--g)}
.steps{display:flex;gap:4px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:4px;background:var(--l)}.steps i.on{background:var(--b)}
.tk{cursor:pointer}.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}.stat b{display:block;font-size:20px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:7px 6px;border-bottom:1px solid var(--l);font-size:13px}th{color:var(--m);font-size:11px}
#bg{display:none;position:fixed;inset:0;background:#0009;z-index:20;padding:10px;overflow:auto}#bg.on{display:block}#md{background:var(--p);border-radius:12px;padding:14px;max-width:700px;margin:auto}
canvas{width:100%;height:120px;border:1px dashed var(--m);border-radius:8px;background:#fff;touch-action:none}.ph{display:flex;gap:6px;flex-wrap:wrap}.ph img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.pr{background:#fff;color:#111;padding:14px;font-family:Arial}.pr td,.pr th{color:#111;border-color:#ccc}#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#17233e;color:#fff;padding:9px 14px;border-radius:9px;opacity:0;transition:.2s;z-index:30;pointer-events:none}#toast.on{opacity:1}
@media print{header,nav,main,.np{display:none!important}#bg{position:static;background:none;padding:0;display:block}#md{padding:0;max-width:none}}
</style></head><body>
<header><h1 id="ttl">🔧 Quản lý sửa chữa</h1><select id="role" style="width:auto" onchange="setRole(this.value)"><option value="staff">Nhân viên</option><option value="manager">Quản lý</option><option value="admin">Quản trị</option></select><button class="btn x" onclick="tg()">◐</button></header>
<nav id="nav"></nav><main id="app"></main><div id="bg" onclick="if(event.target.id=='bg')cl()"><div id="md"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),M=n=>(+n||0).toLocaleString('vi-VN')+'đ',D0={t:[],p:[],log:[],tech:['Kỹ thuật 1','Kỹ thuật 2'],role:'admin',shop:{n:'Cửa hàng sửa chữa',ph:'',ad:''},seq:0,sv:[{n:'Công kiểm tra',pr:50000},{n:'Vệ sinh máy',pr:100000},{n:'Cài lại phần mềm',pr:100000},{n:'Thay pin',pr:150000},{n:'Thay màn hình',pr:500000}]};
let D;try{D=JSON.parse(localStorage.getItem('rp1'))||D0}catch{D=D0}D={...D0,...D};
const ST=['Tiếp nhận','Báo giá','Đang sửa','Hoàn thành','Đã giao'],RL={staff:1,manager:2,admin:3};let tab='t',q='',fs='';
function sv(){try{localStorage.setItem('rp1',JSON.stringify(D))}catch{toast('Bộ nhớ đầy – hãy sao lưu và xóa bớt ảnh')}}
function toast(s){const t=$('#toast');t.textContent=s;t.className='on';setTimeout(()=>t.className='',2200)}
function log(s){D.log.unshift({d:new Date().toISOString(),r:D.role,s});D.log=D.log.slice(0,300)}
function can(n){return RL[D.role]>=n}
function tg(){const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'}
const sum=t=>t.parts.reduce((s,x)=>s+x.q*x.pr,0)+(+t.labor||0),debt=t=>Math.max(0,sum(t)-t.paid),fd=d=>d?new Date(d).toLocaleDateString('vi-VN'):'—';
const wEnd=t=>{if(!t.done||!t.wm)return null;const d=new Date(t.done);d.setMonth(d.getMonth()+ +t.wm);return d},wOn=t=>{const w=wEnd(t);return w&&w>=new Date()},late=t=>t.status!=='Đã giao'&&t.due&&new Date(t.due)<new Date(new Date().toDateString());
function R(){$('#role').value=D.role;$('#nav').innerHTML=[['t','Phiếu'],['f','🔍 Tra cứu'],['n','＋ Tiếp nhận'],['p','Linh kiện'],['k','Khách'],['r','Thống kê'],['s','Cài đặt']].map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';R()">${l}</button>`).join('');$('#app').innerHTML={t:list,f:look,n:()=>form(),p:parts,k:cust,r:stats,s:sett}[tab]()}
function pill(t){return `${t.pr=='Gấp'?'<span class="pill r">GẤP</span> ':''}<span class="pill ${t.status=='Đã giao'?'k':late(t)?'r':''}">${t.status}</span>`}
function list(){const f=D.t.filter(t=>(!fs||t.status==fs)&&(t.code+t.name+t.phone+t.imei+t.model).toLowerCase().includes(q.toLowerCase()));const od=D.t.filter(late).length,lw=D.p.filter(p=>p.s<=p.min).length,ap=D.t.filter(t=>t.due&&t.status!='Đã giao'&&t.due==new Date().toISOString().slice(0,10)).length;
return `<div class="stat"><div class="c"><b>${D.t.filter(t=>t.status!='Đã giao').length}</b><span class="mut">Đang xử lý</span></div><div class="c"><b style="color:var(--r)">${od}</b><span class="mut">Quá hạn</span></div><div class="c"><b>${ap}</b><span class="mut">Hẹn hôm nay</span></div><div class="c"><b>${D.t.reduce((s,t)=>s+debt(t),0)?M(D.t.reduce((s,t)=>s+debt(t),0)):'0'}</b><span class="mut">Công nợ</span></div></div>${lw?`<div class="c"><span class="pill w">⚠ ${lw} linh kiện sắp hết</span></div>`:''}
<div class="row"><input placeholder="Tìm mã phiếu, tên, SĐT, IMEI, model…" value="${e(q)}" oninput="q=this.value;lst()"><select onchange="fs=this.value;lst()"><option value="">Mọi trạng thái</option>${ST.map(s=>`<option ${fs==s?'selected':''}>${s}</option>`)}</select></div><div id="lst" style="margin-top:10px">${rows(f)}</div>`}
function lst(){$('#lst').innerHTML=rows(D.t.filter(t=>(!fs||t.status==fs)&&(t.code+t.name+t.phone+t.imei+t.model).toLowerCase().includes(q.toLowerCase())))}
function rows(a){return a.slice().sort((x,y)=>(x.status=='Đã giao')-(y.status=='Đã giao')||(y.pr=='Gấp')-(x.pr=='Gấp')||(x.due||'9').localeCompare(y.due||'9')).map(t=>`<div class="c tk" onclick="view('${t.id}')"><div class="row" style="justify-content:space-between"><b>${t.code} · ${e(t.name)}</b>${pill(t)}</div><div class="mut">${e(t.type)} ${e(t.model)} · ${e(t.phone)} · KT: ${e(t.tech||'chưa phân công')}</div><div class="steps">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(t.status)?'on':''}"></i>`).join('')}</div><div class="mut">${t.loc?'📍'+e(t.loc)+' · ':''}Hẹn: ${fd(t.due)}${late(t)?' · <b style="color:var(--r)">QUÁ HẠN</b>':''} · ${M(sum(t))}${debt(t)?' · nợ '+M(debt(t)):''}${wOn(t)?' · <span class="pill k">BH đến '+fd(wEnd(t))+'</span>':''}</div></div>`).join('')||'<p class="mut">Chưa có phiếu.</p>'}
let tmp={};
function form(){tmp={b:[],sig:''};return `<div class="c"><h2>Tiếp nhận thiết bị</h2><div class="g2"><div><label>Tên khách *</label><input id="fn"></div><div><label>Số điện thoại *</label><input id="fp" type="tel" oninput="hint()"></div><div><label>Loại thiết bị</label><select id="ft"><option>Điện thoại</option><option>Laptop</option><option>Máy tính bảng</option><option>Máy tính bàn</option><option>Khác</option></select></div><div><label>Model</label><input id="fm"></div><div><label>IMEI / Serial</label><input id="fi" oninput="hint()"></div><div><label>Hẹn trả</label><input id="fd" type="date"></div><div><label>Mức ưu tiên</label><select id="fr"><option>Thường</option><option>Gấp</option></select></div><div><label>Mật khẩu / PIN máy</label><input id="fk"></div></div><div id="ht"></div>
<label>Phụ kiện kèm theo</label><input id="fa" placeholder="Sạc, ốp, sim…"><label>Tình trạng / lỗi khách báo</label><textarea id="fc" rows="3"></textarea><div class="row" style="gap:6px;margin:4px 0">${['Vỡ màn','Không lên nguồn','Vào nước','Pin chai','Lỗi sạc','Loa/mic','Treo logo','Chạy chậm'].map(x=>`<button type="button" class="btn x" style="padding:5px 9px" onclick="fc.value+=(fc.value?', ':'')+'${x}'">${x}</button>`).join('')}</div><label>Kiểm tra ngoại quan</label><div class="row" id="ck">${['Trầy xước','Móp méo','Có sim','Có thẻ nhớ','Bật được nguồn','Cảm ứng OK'].map(x=>`<label style="display:flex;gap:5px;align-items:center;margin:0;flex:1 1 45%"><input type="checkbox" value="${x}" style="width:auto">${x}</label>`).join('')}</div><label>Ảnh tình trạng trước sửa</label><input type="file" accept="image/*" multiple onchange="img(this,'b','phb')"><div class="ph" id="phb"></div><label>Đặt cọc (đ)</label><input id="fo" type="number" value="0"><label>Chữ ký khách xác nhận</label><canvas id="sg"></canvas><div class="row" style="margin-top:8px"><button class="btn x" onclick="sgClr()">Xóa chữ ký</button><button class="btn" onclick="mk()">Tạo phiếu</button></div></div>`}
setTimeout(()=>{},0);
function hint(){const p=$('#fp')?.value,i=$('#fi')?.value;const h=D.t.filter(t=>(p&&t.phone==p||i&&t.imei==i));$('#ht').innerHTML=h.length?`<div class="c"><b>Lịch sử:</b> ${h.length} lần sửa trước. ${h.some(wOn)?'<span class="pill k">Còn bảo hành – kiểm tra phiếu cũ</span>':''}</div>`:''}
function sgInit(){const c=$('#sg');if(!c)return;c.width=c.clientWidth*2;c.height=240;const x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#000';let d=0;const P=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*2,(ev.clientY-r.top)*2]};c.onpointerdown=ev=>{d=1;x.beginPath();x.moveTo(...P(ev));c.setPointerCapture(ev.pointerId)};c.onpointermove=ev=>{if(d){x.lineTo(...P(ev));x.stroke()}};c.onpointerup=()=>{d=0;tmp.sig=c.toDataURL()}}
function sgClr(){const c=$('#sg');c.getContext('2d').clearRect(0,0,c.width,c.height);tmp.sig=''}
function img(inp,k,box,t){[...inp.files].forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.6);if(t){t[k].push(u);sv();view(t.id)}else{tmp[k].push(u);$('#'+box).innerHTML+=`<img src="${u}">`}};i.src=r.result};r.readAsDataURL(f)})}
function mk(){const n=$('#fn').value.trim(),p=$('#fp').value.trim();if(!n||!p)return toast('Nhập tên và SĐT');const id='i'+Date.now(),t={id,code:'TC-'+String(++D.seq).padStart(4,'0'),name:n,phone:p,type:$('#ft').value,model:$('#fm').value,imei:$('#fi').value,acc:$('#fa').value,cond:$('#fc').value,pr:$('#fr').value,pk:$('#fk').value,ck:[...document.querySelectorAll('#ck input:checked')].map(x=>x.value),date:new Date().toISOString(),due:$('#fd').value,status:'Tiếp nhận',tech:'',quote:0,qs:'Chưa báo giá',parts:[],labor:0,deposit:+$('#fo').value||0,paid:+$('#fo').value||0,wm:0,done:'',before:tmp.b,after:[],sig:tmp.sig,notes:[{d:new Date().toISOString(),s:'Tiếp nhận thiết bị'}]};D.t.unshift(t);log('Tạo phiếu '+t.code);sv();tab='t';R();view(id);toast('Đã tạo '+t.code)}
function note(t,s){t.notes.unshift({d:new Date().toISOString(),s});log(t.code+': '+s)}
function view(id){const t=D.t.find(x=>x.id==id),w=wEnd(t);md(`<div class="row np" style="justify-content:space-between"><h2 style="margin:0">${t.code} ${pill(t)}</h2><button class="btn x" onclick="cl()">✕</button></div><p><b>${e(t.name)}</b> · ${e(t.phone)}<br>${e(t.type)} ${e(t.model)} · IMEI/SN: ${e(t.imei)||'—'}<br><span class="mut">Phụ kiện: ${e(t.acc)||'—'} · Lỗi: ${e(t.cond)||'—'}<br>Ngoại quan: ${(t.ck||[]).join(', ')||'—'}${t.pk?'<br>🔑 Mật khẩu máy: '+e(t.pk):''}</span></p>${w?`<p><span class="pill ${wOn(t)?'k':'r'}">Bảo hành đến ${fd(w)}</span></p>`:''}
<div class="row np" style="margin-bottom:8px"><a class="btn a" href="tel:${e(t.phone)}">📞 Gọi</a><a class="btn a" target="_blank" href="https://zalo.me/${e(t.phone)}">Zalo</a><button class="btn a" onclick="msg('${id}')">💬 Soạn tin</button>${t.status=='Hoàn thành'||t.status=='Đã giao'?`<button class="btn a" onclick="wr('${id}')">🛡 Bảo hành lại</button>`:''}</div><div class="row"><input id="vloc" placeholder="📍 Vị trí để máy (Kệ A2, hộc 3…)" value="${e(t.loc||'')}"></div><div class="row" style="margin-top:6px"><select id="vs">${ST.map(s=>`<option ${t.status==s?'selected':''}>${s}</option>`)}</select><select id="vt"><option value="">— Phân công —</option>${D.tech.map(x=>`<option ${t.tech==x?'selected':''}>${e(x)}</option>`)}</select><button class="btn" onclick="upd('${id}')">Lưu</button></div>
<div class="c" style="margin-top:10px"><h3>Báo giá: ${t.qs}</h3><div class="row"><input id="vl" type="number" placeholder="Tiền công" value="${t.labor||''}"><input id="vw" type="number" placeholder="Bảo hành (tháng)" value="${t.wm||''}"></div><div class="row" style="margin-top:6px"><button class="btn a" onclick="qs('${id}','Chờ duyệt')">Gửi báo giá</button><button class="btn a" onclick="qs('${id}','Đã duyệt')">Khách duyệt</button><button class="btn d" onclick="qs('${id}','Khách từ chối')">Từ chối</button></div></div>
<div class="c"><h3>Linh kiện dùng</h3>${t.parts.map((x,i)=>`<div class="row" style="justify-content:space-between"><span>${e(x.n)} ×${x.q}</span><span>${M(x.q*x.pr)} <button class="btn d" onclick="rmP('${id}',${i})">×</button></span></div>`).join('')||'<span class="mut">Chưa có</span>'}<div class="row" style="margin-top:6px"><select id="vp">${D.p.map(p=>`<option value="${p.id}">${e(p.n)} (tồn ${p.s})</option>`)}</select><input id="vq" type="number" value="1" min="1" style="max-width:70px"><button class="btn a" onclick="addP('${id}')">Xuất kho</button></div><div class="row" style="margin-top:6px"><select id="vsv">${D.sv.map((s,i)=>`<option value="${i}">${e(s.n)} – ${M(s.pr)}</option>`).join('')}</select><button class="btn a" onclick="addS('${id}')">Thêm dịch vụ</button></div><p><b>Tổng: ${M(sum(t))}</b> · Đã thu: ${M(t.paid)} · <b style="color:${debt(t)?'var(--r)':'var(--g)'}">Nợ: ${M(debt(t))}</b></p><div class="row"><input id="vm" type="number" placeholder="Thu thêm (đ)"><button class="btn" onclick="pay('${id}')">Thu tiền</button>${debt(t)?`<button class="btn a" onclick="$('#vm').value=${debt(t)};pay('${id}')">Thu hết nợ</button>`:''}</div></div>
<div class="c"><h3>Ảnh</h3><span class="mut">Trước sửa</span><div class="ph">${t.before.map(u=>`<img src="${u}">`).join('')}</div><span class="mut">Sau sửa</span><div class="ph">${t.after.map(u=>`<img src="${u}">`).join('')}</div><input type="file" accept="image/*" multiple onchange="img(this,'after','',D.t.find(x=>x.id=='${id}'))"></div>
<div class="c"><h3>Lịch sử xử lý</h3>${t.notes.map(n=>`<div class="mut">${new Date(n.d).toLocaleString('vi-VN')} – ${e(n.s)}</div>`).join('')}<div class="row" style="margin-top:6px"><input id="vn" placeholder="Ghi chú xử lý…"><button class="btn a" onclick="addN('${id}')">Thêm</button></div></div>
<div class="row np"><button class="btn" onclick="tem('${id}',2,60)">🏷 In tem dán máy</button><button class="btn" onclick="prt('${id}','in')">In phiếu nhận</button><button class="btn a" onclick="prt('${id}','rp')">Phiếu sửa chữa</button><button class="btn a" onclick="prt('${id}','hd')">Hóa đơn</button>${can(2)?`<button class="btn d" onclick="del('${id}')">Xóa</button>`:''}</div>`)}
function upd(id){const t=D.t.find(x=>x.id==id),s=$('#vs').value,k=$('#vt').value;t.loc=$('#vloc').value;t.labor=+$('#vl').value||0;t.wm=+$('#vw').value||0;if(s!=t.status){if(s=='Hoàn thành'&&!t.done)t.done=new Date().toISOString();note(t,'Trạng thái → '+s);t.status=s}if(k!=t.tech){t.tech=k;note(t,'Phân công: '+(k||'bỏ'))}sv();R();view(id)}
function qs(id,s){const t=D.t.find(x=>x.id==id);t.labor=+$('#vl').value||0;t.wm=+$('#vw').value||0;t.qs=s;t.quote=sum(t);if(s=='Chờ duyệt'&&t.status=='Tiếp nhận')t.status='Báo giá';if(s=='Đã duyệt'&&t.status=='Báo giá')t.status='Đang sửa';note(t,'Báo giá '+M(t.quote)+': '+s);sv();R();view(id)}
function addP(id){const t=D.t.find(x=>x.id==id),p=D.p.find(x=>x.id==$('#vp').value),n=+$('#vq').value||1;if(!p||p.s<n)return toast('Không đủ tồn kho');p.s-=n;const x=t.parts.find(y=>y.pid==p.id);x?x.q+=n:t.parts.push({pid:p.id,n:p.n,q:n,pr:p.pr});note(t,`Xuất ${n} ${p.n}`);sv();view(id)}
function rmP(id,i){const t=D.t.find(x=>x.id==id),x=t.parts[i],p=D.p.find(y=>y.id==x.pid);if(p)p.s+=x.q;t.parts.splice(i,1);note(t,'Trả kho '+x.n);sv();view(id)}
function pay(id){const t=D.t.find(x=>x.id==id),v=+$('#vm').value;if(v<=0)return;t.paid+=v;note(t,'Thu '+M(v));if(!debt(t)&&t.status=='Hoàn thành'){t.status='Đã giao';note(t,'Đã thanh toán đủ → Đã giao')}sv();R();view(id)}
function addN(id){const t=D.t.find(x=>x.id==id),v=$('#vn').value.trim();if(v){note(t,v);sv();view(id)}}
function del(id){if(!confirm('Xóa phiếu này?'))return;const t=D.t.find(x=>x.id==id);t.parts.forEach(x=>{const p=D.p.find(y=>y.id==x.pid);if(p)p.s+=x.q});D.t=D.t.filter(x=>x.id!=id);log('Xóa phiếu '+t.code);sv();cl();R()}
function prt(id,k){const t=D.t.find(x=>x.id==id),S=D.shop,u=location.href.split('#')[0]+'#'+t.code;let qr='';try{const g=qrcode(0,'M');g.addData(u);g.make();qr=g.createSvgTag(3)}catch{qr='<small>(QR cần Internet)</small>'}
const tt={in:'PHIẾU TIẾP NHẬN',rp:'PHIẾU SỬA CHỮA',hd:'HÓA ĐƠN'}[k];md(`<div class="np row"><button class="btn" onclick="print()">🖨 In / Lưu PDF</button><button class="btn x" onclick="view('${id}')">← Quay lại</button></div><div class="pr"><center><b style="font-size:17px">${e(S.n)}</b><br>${e(S.ad)} ${e(S.ph)}<h3>${tt}</h3><b>${t.code}</b> · ${new Date(t.date).toLocaleString('vi-VN')}</center><p>Khách: <b>${e(t.name)}</b> · ${e(t.phone)}<br>Thiết bị: ${e(t.type)} ${e(t.model)} · IMEI/SN: ${e(t.imei)||'—'}<br>Phụ kiện: ${e(t.acc)||'—'}<br>Tình trạng: ${e(t.cond)||'—'}<br>Hẹn trả: ${fd(t.due)}${k=='rp'?'<br>Kỹ thuật: '+e(t.tech||'—'):''}</p>${k!='in'?`<table><tr><th>Hạng mục</th><th>SL</th><th>Thành tiền</th></tr>${t.parts.map(x=>`<tr><td>${e(x.n)}</td><td>${x.q}</td><td>${M(x.q*x.pr)}</td></tr>`).join('')}<tr><td>Tiền công</td><td>1</td><td>${M(t.labor)}</td></tr></table><p style="text-align:right"><b>Tổng ${M(sum(t))}</b><br>Đã thu ${M(t.paid)} · Còn nợ ${M(debt(t))}</p>`:`<p>Đặt cọc: ${M(t.deposit)}</p>`}${t.wm&&k=='hd'?`<p>Bảo hành ${t.wm} tháng${wEnd(t)?' (đến '+fd(wEnd(t))+')':''}</p>`:''}<div class="row" style="justify-content:space-between;align-items:end"><div>${qr}<br><small>Quét để tra cứu tiến độ</small></div><div style="text-align:center">Khách ký<br>${t.sig?`<img src="${t.sig}" style="height:60px">`:'<br><br>'}</div></div></div>`)}
function stats(){const T=D.t,dn=T.filter(t=>t.done),cost=t=>t.parts.reduce((s,x)=>s+x.q*((D.p.find(p=>p.id==x.pid)||{}).c||0),0),rev=dn.reduce((s,t)=>s+sum(t),0),pf=dn.reduce((s,t)=>s+sum(t)-cost(t),0),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d.toISOString().slice(0,10)}),v=days.map(k=>dn.filter(t=>t.done.slice(0,10)==k).reduce((s,t)=>s+sum(t),0)),mx=Math.max(...v,1),dt=T.filter(t=>debt(t)>0);
return `<div class="stat"><div class="c"><b>${M(rev)}</b><span class="mut">Doanh thu (phiếu xong)</span></div><div class="c"><b style="color:var(--g)">${M(pf)}</b><span class="mut">Lợi nhuận gộp</span></div><div class="c"><b>${T.length}</b><span class="mut">Tổng phiếu</span></div><div class="c"><b style="color:var(--r)">${M(dt.reduce((s,t)=>s+debt(t),0))}</b><span class="mut">Công nợ</span></div></div><div class="c"><h3>Doanh thu 7 ngày</h3><div class="bar">${v.map((x,i)=>`<div title="${M(x)}" style="height:${x/mx*100}%"></div>`).join('')}</div><div class="bar" style="height:auto;color:var(--m);font-size:10px">${days.map(d=>`<span style="flex:1;text-align:center">${d.slice(8)}/${d.slice(5,7)}</span>`).join('')}</div></div><div class="c tbl"><h3>Hiệu suất kỹ thuật viên</h3><table><tr><th>Kỹ thuật</th><th>Đang làm</th><th>Đã xong</th><th>Doanh thu</th></tr>${D.tech.map(k=>{const a=dn.filter(t=>t.tech==k);return `<tr><td>${e(k)}</td><td>${T.filter(t=>t.tech==k&&!t.done).length}</td><td>${a.length}</td><td>${M(a.reduce((s,t)=>s+sum(t),0))}</td></tr>`}).join('')}</table></div><div class="c"><h3>Theo trạng thái</h3>${ST.map(s=>`<span class="pill" style="margin:2px">${s}: ${T.filter(t=>t.status==s).length}</span>`).join('')}</div><div class="c"><h3>Khách còn nợ</h3>${dt.map(t=>`<div class="row tk" style="justify-content:space-between" onclick="view('${t.id}')"><span>${t.code} · ${e(t.name)}</span><b style="color:var(--r)">${M(debt(t))}</b></div>`).join('')||'<span class="mut">Không có công nợ 🎉</span>'}</div>`}
function setRole(v){if(D.pin&&RL[v]>1&&prompt('Nhập mã PIN:')!==D.pin){toast('Sai PIN');$('#role').value=D.role;return}D.role=v;sv();R()}
function msg(id){const t=D.t.find(x=>x.id==id),m={'Tiếp nhận':'đã được tiếp nhận','Báo giá':`đã có báo giá ${M(sum(t))}, vui lòng phản hồi`,'Đang sửa':'đang được sửa chữa','Hoàn thành':`đã sửa xong, mời quý khách đến nhận (còn thanh toán ${M(debt(t))})`,'Đã giao':'đã bàn giao, cảm ơn quý khách'},s=`${D.shop.n}: thiết bị ${t.model||t.type} (phiếu ${t.code}) ${m[t.status]}.`;navigator.clipboard?.writeText(s).catch(()=>{});toast('Đã sao chép tin nhắn');location.href='sms:'+t.phone+'?body='+encodeURIComponent(s)}
function wr(id){const t=D.t.find(x=>x.id==id);if(!wOn(t)&&!confirm('Đã hết hạn bảo hành. Vẫn tạo phiếu?'))return;const n={...t,id:'i'+Date.now(),code:'TC-'+String(++D.seq).padStart(4,'0'),date:new Date().toISOString(),due:'',status:'Tiếp nhận',tech:'',quote:0,qs:'Bảo hành',parts:[],labor:0,deposit:0,paid:0,wm:0,done:'',before:[],after:[],sig:'',pr:'Gấp',cond:'BẢO HÀNH từ '+t.code+': '+t.cond,notes:[{d:new Date().toISOString(),s:'Tạo từ bảo hành '+t.code}]};D.t.unshift(n);log('Bảo hành '+n.code);sv();R();view(n.id)}
function look(){return `<div class="c"><h2>Tra cứu máy / phiếu / khách</h2><div class="row"><input id="lq" placeholder="Mã phiếu, IMEI, SĐT, tên, model, vị trí…" oninput="lr()" onkeydown="if(event.key=='Enter')lg()" autofocus><button class="btn a" onclick="scan()">📷 Quét mã</button></div><p class="mut">Máy quét USB: bấm vào ô tìm rồi quét tem, Enter sẽ mở phiếu. Khi chưa nhập gì: hiện phiếu sắp đến hạn trong 3 ngày hoặc quá hạn.</p></div><div id="lres">${lr(1)}</div>`}
function lm(v){return v?D.t.filter(t=>(t.code+t.name+t.phone+t.imei+t.model+(t.loc||'')).toLowerCase().includes(v)):D.t.filter(t=>t.status!='Đã giao'&&t.due&&(new Date(t.due)-new Date())/864e5<=3)}
function lr(r){const v=($('#lq')?.value||'').trim().toLowerCase(),a=lm(v),h=`<p class="mut">${a.length} kết quả</p>`+rows(a);if(r)return h;$('#lres').innerHTML=h}
function lg(){const v=$('#lq').value.trim().toLowerCase(),a=lm(v),x=a.find(t=>t.code.toLowerCase()==v||t.imei.toLowerCase()==v)||(a.length==1&&a[0]);if(x)view(x.id);else toast('Không có phiếu khớp duy nhất')}
async function scan(){if(!window.BarcodeDetector)return toast('Trình duyệt chưa hỗ trợ quét camera – dùng máy quét USB hoặc nhập tay');md('<video id="vd" playsinline muted style="width:100%;border-radius:8px"></video><button class="btn x" onclick="stopScan()">Đóng</button>');try{window.cs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});vd.srcObject=cs;await vd.play();const bd=new BarcodeDetector({formats:['qr_code','code_128']}),tick=async()=>{if(!window.cs)return;try{const r=await bd.detect(vd);if(r.length){const c=r[0].rawValue.split('#').pop();stopScan();$('#lq').value=c;lr();lg();return}}catch{}requestAnimationFrame(tick)};tick()}catch{toast('Không mở được camera');cl()}}
function stopScan(){window.cs?.getTracks().forEach(t=>t.stop());window.cs=null;cl()}
function addS(id){const t=D.t.find(x=>x.id==id),s=D.sv[+$('#vsv').value];if(!s)return;const x=t.parts.find(y=>!y.pid&&y.n==s.n);x?x.q++:t.parts.push({pid:'',n:s.n,q:1,pr:s.pr});note(t,'Thêm dịch vụ '+s.n);sv();view(id)}
function tem(id,n,w){const t=D.t.find(x=>x.id==id);n=Math.min(40,Math.max(1,+n||1));w=+w||60;let qr='';try{const g=qrcode(0,'M');g.addData(location.href.split('#')[0]+'#'+t.code);g.make();qr=g.createSvgTag(w>=60?3:2)}catch{qr='<small>(QR cần Internet)</small>'}md(`<div class="np row"><label style="margin:0">Số tem<input id="tn" type="number" value="${n}" min="1" onchange="tem('${id}',this.value,$('#tw').value)"></label><label style="margin:0">Khổ tem<select id="tw" onchange="tem('${id}',$('#tn').value,this.value)">${[[50,'50×30mm'],[60,'60×40mm'],[80,'80×50mm']].map(([a,b])=>`<option value="${a}" ${a==w?'selected':''}>${b}</option>`).join('')}</select></label><button class="btn" onclick="print()">🖨 In tem</button><button class="btn x" onclick="view('${id}')">← Quay lại</button></div><div class="lbs">${Array(n).fill(`<div class="lb" style="width:${w}mm;height:${w*.62}mm">${qr}<div><b>${t.code}</b><br>${e(t.name)}<br>${e(t.model||t.type)}<br>${e(t.phone)}<br>Hẹn: ${fd(t.due)}${t.loc?'<br>📍'+e(t.loc):''}${t.pr=='Gấp'?'<br><b>★ GẤP</b>':''}</div></div>`).join('')}</div>`)}
function parts(){return `<div class="c"><h2>Linh kiện & kho</h2>${can(2)?`<div class="g2"><input id="pn" placeholder="Tên linh kiện"><input id="ps" placeholder="Nhà cung cấp"><input id="pc" type="number" placeholder="Giá nhập"><input id="pp" type="number" placeholder="Giá bán"><input id="pq" type="number" placeholder="Số lượng nhập"><input id="pm" type="number" placeholder="Ngưỡng cảnh báo" value="2"></div><button class="btn" style="margin-top:8px" onclick="np()">Nhập kho</button>`:'<span class="mut">Cần quyền Quản lý để nhập kho</span>'}</div><div class="c tbl"><table><tr><th>Linh kiện</th><th>NCC</th><th>Vốn</th><th>Bán</th><th>Tồn</th><th></th></tr>${D.p.map(p=>`<tr><td>${e(p.n)}</td><td>${e(p.sp)}</td><td>${M(p.c)}</td><td>${M(p.pr)}</td><td>${p.s<=p.min?'<span class="pill w">'+p.s+'</span>':p.s}</td><td>${can(2)?`<button class="btn a" onclick="rs('${p.id}')">＋</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Chưa có linh kiện</td></tr>'}</table></div>`}
function np(){const n=$('#pn').value.trim();if(!n)return;D.p.push({id:'p'+Date.now(),n,sp:$('#ps').value,c:+$('#pc').value||0,pr:+$('#pp').value||0,s:+$('#pq').value||0,min:+$('#pm').value||0});log('Nhập kho '+n);sv();R()}
function rs(id){const n=+prompt('Nhập thêm số lượng:');if(n>0){const p=D.p.find(x=>x.id==id);p.s+=n;log(`Nhập kho +${n} ${p.n}`);sv();R()}}
function cust(){const m={};D.t.forEach(t=>{(m[t.phone]=m[t.phone]||{n:t.name,a:[]}).a.push(t)});return Object.entries(m).map(([p,c])=>`<div class="c"><b>${e(c.n)}</b> · ${e(p)} <span class="mut">(${c.a.length} lần · ${M(c.a.reduce((s,t)=>s+sum(t),0))})</span>${c.a.map(t=>`<div class="mut tk" onclick="view('${t.id}')">${t.code} · ${e(t.model)} · ${t.status} ${wOn(t)?'· còn BH':''}</div>`).join('')}</div>`).join('')||'<p class="mut">Chưa có khách.</p>'}
function sett(){return `<div class="c"><h2>Cửa hàng</h2><input id="sn" value="${e(D.shop.n)}"><input id="sa" placeholder="Địa chỉ" value="${e(D.shop.ad)}" style="margin-top:6px"><input id="sp" placeholder="Điện thoại" value="${e(D.shop.ph)}" style="margin-top:6px"><label>Kỹ thuật viên (mỗi dòng một người)</label><textarea id="st" rows="3">${e(D.tech.join('\n'))}</textarea><label>Bảng giá dịch vụ (mỗi dòng: Tên|Giá)</label><textarea id="ssv" rows="5">${D.sv.map(s=>s.n+'|'+s.pr).join('\n')}</textarea><label>Mã PIN để chuyển quyền Quản lý / Quản trị (để trống = không khóa)</label><input id="sk" type="password" value="${e(D.pin||'')}"><button class="btn" style="margin-top:8px" onclick="ss()" ${can(3)?'':'disabled'}>Lưu (Quản trị)</button></div><div class="c"><h2>Dữ liệu</h2><div class="row"><button class="btn a" onclick="csv()">Xuất Excel (CSV)</button><button class="btn a" onclick="bk()">Sao lưu JSON</button><label class="btn x" style="margin:0">Khôi phục<input hidden type="file" accept=".json" onchange="rt(this)"></label></div><p class="mut">Dữ liệu lưu trong trình duyệt này, không đồng bộ giữa máy. Hãy sao lưu định kỳ.</p></div><div class="c"><h2>Nhật ký thao tác</h2>${D.log.slice(0,40).map(l=>`<div class="mut">${new Date(l.d).toLocaleString('vi-VN')} [${l.r}] ${e(l.s)}</div>`).join('')||'<span class="mut">Trống</span>'}</div>`}
function ss(){D.sv=$('#ssv').value.split('\n').map(l=>l.split('|')).filter(a=>a[0].trim()).map(a=>({n:a[0].trim(),pr:+a[1]||0}));D.pin=$('#sk').value;D.shop={n:$('#sn').value,ad:$('#sa').value,ph:$('#sp').value};D.tech=$('#st').value.split('\n').map(x=>x.trim()).filter(Boolean);log('Đổi cấu hình');sv();toast('Đã lưu')}
function dl(s,n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:t}));a.download=n;a.click()}
function csv(){const r=[['Mã','Khách','SĐT','Thiết bị','IMEI','Trạng thái','Kỹ thuật','Tổng','Đã thu','Nợ']].concat(D.t.map(t=>[t.code,t.name,t.phone,t.type+' '+t.model,t.imei,t.status,t.tech,sum(t),t.paid,debt(t)]));dl('\ufeff'+r.map(x=>x.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'phieu-sua-chua.csv','text/csv')}
function bk(){D.lb=Date.now();sv();dl(JSON.stringify(D),'sao-luu.json','application/json')}
function rt(i){const r=new FileReader();r.onload=()=>{try{D={...D0,...JSON.parse(r.result)};sv();R();toast('Đã khôi phục')}catch{toast('Tệp lỗi')}};r.readAsText(i.files[0])}
function md(h){$('#md').innerHTML=h;$('#bg').className='on'}function cl(){$('#bg').className=''}
function lookup(){const c=location.hash.slice(1),t=D.t.find(x=>x.code==c);if(!/^TC-\d+$/.test(c))return;if(!t)return toast('Không thấy phiếu '+c);md(`<div class="row np" style="justify-content:space-between"><h2 style="margin:0">Tra cứu ${t.code}</h2><button class="btn x" onclick="cl()">✕</button></div><p>${e(t.type)} ${e(t.model)}</p><div class="steps">${ST.map((s,i)=>`<i class="${i<=ST.indexOf(t.status)?'on':''}"></i>`).join('')}</div><p><b>${t.status}</b> · Hẹn trả ${fd(t.due)}</p>${t.notes.slice(0,5).map(n=>`<div class="mut">${new Date(n.d).toLocaleString('vi-VN')} – ${e(n.s)}</div>`).join('')}`)}
addEventListener('hashchange',lookup);new MutationObserver(()=>{if($('#sg')&&!$('#sg').onpointerdown)sgInit()}).observe($('#app'),{childList:true});if(D.pin)D.role='staff';if(D.t.length&&Date.now()-(D.lb||0)>6048e5)setTimeout(()=>toast('Đã hơn 7 ngày chưa sao lưu – vào Cài đặt để sao lưu'),1500);R();lookup();
</script></body></html>
